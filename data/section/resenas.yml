    md: |
      ¿Conoces la sensación de tener una rutina integrada en tu vida ? ¿Esa que ya es imprescindible para que todo vaya bien a lo largo del día? (ducharte por la noche, desayunar todos los días, leer antes de dormir...) pues Adela consigue que sus clases de Pilates sean un "imprescindible" En tu vida.

      Las clases de Studio son como un traje hecho a medida, con dedicación y esfuerzo en ambas direcciones.

      ¡Más que recomendable!
  - title: Mª Luisa G.J.
    img: https://lh3.googleusercontent.com/a-/AOh14GhkV0iSe3nKnX4E9t_YNRc9P0XfeEeQw41QolInPA=w144
    md: |
      Un lugar maravilloso, donde podras encontrar todo tipos de entrenamientos.

      Puedo decir que he pasado desde el entrenamiento prenatal, personalizados y studio pilates y son todos de 10.

      El metodo Pilates es único y sales genial de esas clases.

      Recomendable.

      Gracias al super equipazo.
  - title: Mariana S.
    img: https://lh3.googleusercontent.com/a-/AOh14Giqg8_ZEMcF83yPP96YipJ9pEXutUibRKSN36Y5RA=w144
    md: |
      Tengo el propósito de no dar consejos a mujeres embarazadas, porque entiendo que cada embarazo es un mundo, pero si tuviera que dar solo un consejo sería "Ve a Movere".

      En las clases de Pilates Prenatal, Adela y su equipo me ofrecieron la mejor preparación física para que el embarazo y el parto fueran experiencias muy agradables.

      Con los entrenamientos personales tuve una cuidadosa, progresiva y fructífera recuperación posparto.

      En las clases de mamá&bebé, el peque y yo disfrutamos de compartir esa actividad con Adela acompañándonos al otro lado de la pantalla.

      Y ahora, las sesiones de Pilates Studio son ese maravilloso espacio en el que se unen la profesionalidad, el cuidado, el cariño, la motivación y la atención personalizada.
  - title: Jose Ángel C.G.
